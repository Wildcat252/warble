<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warble</title>
</head>
<body>

  <!--
    Queried directly by services/backend.ts at module-load time — must stay
    present in the static shell (features build their own DOM elsewhere, but
    this one is boot-critical infrastructure, not feature-specific markup).
  -->
  <div id="error-banner" role="alert">
    <span id="error-banner-message"></span>
    <button id="error-banner-action" class="hidden" aria-label="Retry action">Retry</button>
    <button id="error-banner-dismiss" class="hidden" aria-label="Dismiss error">Dismiss</button>
  </div>
  <div id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <!--
    Feature mount slots. Named anchors that features receive as their `slot`
    argument; they do not render visible content themselves (.feature-slot
    is `display: contents`). See src/registry.ts for the full feature list
    and src/screens/registry.ts for the navigable screens app-shell mounts
    inside #screen-root.
  -->
  <div id="slot-app-shell" class="feature-slot"></div>
  <div id="slot-audio-preflight" class="feature-slot"></div>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
